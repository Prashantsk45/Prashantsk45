name: Generate Profile Stats

"on":
  push:
    branches:
      - main
  repository_dispatch:
    types: [update_stats]
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate SVGs
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          python generate_profile_stats.py

      - name: Commit and Push Changes
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          git config --global user.name "Prashantsk45"
          git config --global user.email "Prashantsk.272@gmail.com"
          # Loop to handle any simultaneous pushes without merge conflicts
          for i in {1..5}; do
            git fetch origin main
            git reset --hard origin/main
            python generate_profile_stats.py
            git add generated/*.svg
            if git diff-index --quiet HEAD; then
              echo "No changes to commit."
              exit 0
            fi
            git commit -m "Auto-update profile statistics"
            if git push origin main; then
              echo "Push successful!"
              exit 0
            fi
            echo "Conflict or race condition detected. Retrying in 2 seconds..."
            sleep 2
          done
          echo "Failed to push stats card after 5 attempts."
          exit 1
